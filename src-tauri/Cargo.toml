[package]
name = "stanza"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stanza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Spotify artwork as a data: URL (src/spotify). Already in the lock file through Tauri.
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hit-region polling (src/hit_region.rs) reads the cursor and window origin with plain syscalls
# instead of Tauri getters that each round-trip the main event loop (the Win32_* features tao
# already builds). Spotify's now-playing (src/spotify/gsmtc.rs, D5) needs the WinRT GSMTC API:
# the Foundation, Media_Control, Storage_Streams and Win32_System_WinRT features (the S2 spike's).
# Its per-app volume (src/spotify/volume.rs, S5) needs Core Audio: Win32_Media_Audio, Win32_System_Com
# (+ _StructuredStorage and Win32_System_Variant for IMMDevice::Activate) and Win32_System_Threading.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
